server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 업로드 파일 크기 제한(백엔드 FILE_MAX_SIZE와 맞춘다)
    client_max_body_size 10m;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # 도커 내부 DNS. 변수로 upstream을 지정하면 nginx가 시작할 때 이름을 찾지 않고
    # 요청할 때마다 찾는다. 덕분에 (1) 백엔드보다 먼저 떠도 죽지 않고,
    # (2) --scale backend=2 로 늘린 인스턴스도 곧바로 분배된다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 요청은 백엔드로 넘긴다.
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        set $actuator_upstream backend:8080;
        proxy_pass http://$actuator_upstream;
        proxy_set_header Host $host;
    }

    # 정적 자산은 파일명에 해시가 붙으므로 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: /me 처럼 서버에 없는 경로도 index.html을 돌려줘야
    # React Router가 화면을 그린다. index.html 자체는 캐시하지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
