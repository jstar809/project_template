plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Fullstack template backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    mybatisVersion = '4.1.0'
    springdocVersion = '3.1.1'
    shedlockVersion = '7.10.1'
    jjwtVersion = '0.13.0'
    sanitizerVersion = '20260921.1'
    bucket4jVersion = '8.19.0'
    tikaVersion = '4.0.0'
    logstashEncoderVersion = '9.0'
    archunitVersion = '1.5.0'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // DB
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // MyBatis (조회 전용. 쓰기는 JPA — PRD 8.2 참고)
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisVersion}"

    // API 문서
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // 분산 락 (스케줄러를 여러 인스턴스 중 하나에서만 실행)
    implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

    // 인증
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 보안 유틸
    implementation "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:${sanitizerVersion}"
    implementation "com.bucket4j:bucket4j_jdk17-core:${bucket4jVersion}"
    implementation "org.apache.tika:tika-core:${tikaVersion}"

    // 캐시 / 로깅
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisVersion}"
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트 대상 DB 선택: ./gradlew test -PdbVendor=mysql (기본값 postgresql)
ext.dbVendor = (project.findProperty('dbVendor') ?: 'postgresql').toString()

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'db.vendor', dbVendor
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('bootRun') {
    // 로컬 실행 기본 프로필: local + DB_VENDOR(기본 postgresql)
    def vendor = System.getenv('DB_VENDOR') ?: 'postgresql'
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: "local,db-${vendor}"
}
