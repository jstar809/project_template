# 운영 서버용 compose.
#
# 이 파일과 Caddyfile, deploy.sh, backup.sh 를 서버의 $DEPLOY_PATH 에 두고,
# 비밀값이 담긴 .env.prod 는 서버에만 둔다(절대 커밋하지 않는다).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: ${COMPOSE_PROJECT_NAME:-template}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서. 지우면 재발급이 필요하다.
      - caddy_config:/config
    depends_on:
      - frontend

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    # 포트를 외부에 열지 않는다. 오직 Caddy → frontend(nginx) → backend 경로로만 접근한다.
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
    environment:
      SPRING_PROFILES_ACTIVE: prod,db-${DB_VENDOR:-postgresql}
      DB_HOST: ${DB_VENDOR:-postgresql}
      DB_PORT: ${DB_INTERNAL_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P14D}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-관리자}
      STORAGE_LOCAL_PATH: /app/uploads
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-10MB}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      # 인스턴스를 늘려도 같은 파일을 보도록 볼륨을 공유한다.
      - uploads:/app/uploads
    depends_on:
      postgresql:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false

  postgresql:
    image: postgres:17-alpine
    profiles: ["postgresql"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    # 외부에 포트를 열지 않는다. 같은 네트워크의 backend만 접근한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  mysqldata:
  uploads:
  caddy_data:
  caddy_config:
