version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 관련 라이브러리를 한 PR로 묶어 리뷰 부담을 줄인다.
      spring:
        patterns: ['org.springframework*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      tiptap:
        patterns: ['@tiptap/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
