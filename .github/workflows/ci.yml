name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행을 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 바뀐 영역만 검사해 실행 시간을 줄인다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 같은 테스트를 PostgreSQL과 MySQL 양쪽에서 돌린다(PRD FR-QUALITY-03).
      matrix:
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 포맷 검사 + 테스트 + 빌드 (${{ matrix.db }})
        working-directory: backend
        # Testcontainers가 러너의 Docker를 사용해 실제 DB를 띄운다.
        run: ./gradlew spotlessCheck test build -PdbVendor=${{ matrix.db }} --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report-${{ matrix.db }}
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 포맷 검사
        working-directory: frontend
        run: npm run format:check

      - name: 타입 검사
        working-directory: frontend
        run: npm run typecheck

      - name: 단위/통합 테스트
        working-directory: frontend
        run: npm run test

      - name: 빌드
        working-directory: frontend
        run: npm run build

      - name: 취약점 점검 (실패해도 진행)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 여기서는 빌드만 확인한다(푸시는 CD에서).
      - name: 백엔드 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 프론트 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: changes
    # PR마다 돌리기에는 무거워서 main 브랜치에서만 실행한다.
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 전체 스택 실행
        run: |
          cp .env.example .env
          echo "ADMIN_EMAIL=admin@example.com" >> .env
          echo "ADMIN_PASSWORD=admin1234" >> .env
          docker compose --profile full --profile postgresql up -d --build

      - name: 백엔드가 준비될 때까지 대기
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "준비 완료"; exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=100
          exit 1

      - name: Playwright 설치
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 스모크 테스트
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npm run e2e

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: 스택 로그 (실패 시)
        if: failure()
        run: docker compose logs --tail=200
