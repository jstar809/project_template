name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 대상
        required: true
        default: staging
        type: choice
        options: [staging, production]
      image_tag:
        description: '롤백할 이미지 태그 (비우면 현재 커밋으로 새로 빌드)'
        required: false
        type: string

# 같은 환경에 동시에 배포하지 않는다. 진행 중인 배포는 취소하지 않고 기다린다.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # 롤백(태그 지정) 시에는 빌드를 건너뛴다.
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지 메타데이터
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: 백엔드 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 프론트 이미지 메타데이터
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: 프론트 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    # 롤백 실행이거나(빌드 건너뜀) 정상 빌드 후
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: 배포 실행
        uses: ./.github/actions/deploy
        with:
          image_tag: ${{ github.event.inputs.image_tag || needs.build-and-push.outputs.image_tag }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_port: ${{ secrets.SSH_PORT }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy_path: ${{ vars.DEPLOY_PATH }}

  deploy-production:
    needs: [build-and-push, deploy-staging]
    # main push 흐름에서는 staging 성공 후에, 수동 실행에서는 production 선택 시에 동작한다.
    # GitHub Environments의 Required reviewers 설정으로 여기서 승인 대기가 걸린다.
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
        (github.event_name != 'workflow_dispatch' && needs.deploy-staging.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 배포 실행
        uses: ./.github/actions/deploy
        with:
          image_tag: ${{ github.event.inputs.image_tag || needs.build-and-push.outputs.image_tag }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_port: ${{ secrets.SSH_PORT }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy_path: ${{ vars.DEPLOY_PATH }}
