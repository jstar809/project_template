name: 서버 배포
description: 배포 파일을 서버로 복사하고 deploy.sh 를 실행한다(헬스체크·롤백 포함).

inputs:
  image_tag:
    description: 배포할 이미지 태그
    required: true
  ssh_host:
    required: true
  ssh_port:
    required: false
    default: '22'
  ssh_user:
    required: true
  ssh_private_key:
    required: true
  ssh_known_hosts:
    description: ssh-keyscan 결과. 중간자 공격을 막기 위해 호스트를 검증한다.
    required: true
  deploy_path:
    description: 서버의 배포 디렉터리 (예 /opt/app-prod)
    required: true

runs:
  using: composite
  steps:
    - name: SSH 키 준비
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_private_key }}" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        echo "${{ inputs.ssh_known_hosts }}" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: 배포 파일 복사
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
      run: |
        # .env.prod 는 서버에만 있으므로 복사하지 않는다.
        scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
          deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh \
          "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
        ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "chmod +x $DEPLOY_PATH/deploy.sh $DEPLOY_PATH/backup.sh"

    - name: 배포 실행 (헬스체크 실패 시 자동 롤백)
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "cd $DEPLOY_PATH && ./deploy.sh $IMAGE_TAG"

    - name: SSH 키 정리
      if: always()
      shell: bash
      run: rm -f ~/.ssh/id_deploy
